<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>On The Rocks</title>
<meta name="theme-color" content="#120b07">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="On The Rocks">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* App dalla schermata Home: tela a tutto schermo, niente zoom né rimbalzi della pagina, caricamento in tinta bancone */
  :root {
    --bg: #120b07; --line: rgba(255, 226, 180, .16);
    --cream: #f6ead6; --muted: #c4b29a; --amber: #f2b45c;
    --f-ui: -apple-system, "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; touch-action: none;
    color: var(--cream); font-family: var(--f-ui); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; touch-action: none; }
  #status { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; justify-items: center; background: var(--bg);
    padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left)); text-align: center; }
  #status h1 { margin: 0; font-weight: 800; font-size: 30px; color: var(--amber); letter-spacing: .5px; }
  #status p { margin: 0; color: var(--muted); font-size: 14px; max-width: 34ch; line-height: 1.4; }
  #bar { width: min(320px, 80vw); height: 8px; border-radius: 999px; background: rgba(255, 255, 255, .08); overflow: hidden; border: 1px solid var(--line); }
  #fill { height: 100%; width: 0; background: var(--amber); transition: width .2s; }
  #note { font-variant-numeric: tabular-nums; }
  /* il bar si gioca in orizzontale: in verticale chiedo di girare il telefono */
  #rotate { position: fixed; inset: 0; z-index: 10; display: none; place-content: center; justify-items: center; gap: 16px; background: var(--bg); text-align: center; padding: 24px; }
  #rotate p { margin: 0; color: var(--cream); font-size: 17px; font-weight: 700; }
  #rotate span { color: var(--muted); font-size: 14px; }
  #rotate svg { width: 72px; height: 72px; color: var(--amber); animation: turn 1.8s ease-in-out infinite; }
  @keyframes turn { 0%, 20% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: grid; } }
  @media (prefers-reduced-motion: reduce) { #fill { transition: none; } #rotate svg { animation: none; transform: rotate(-90deg); } }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1">Il gioco richiede un browser con WebGL 2.</canvas>
<div id="status" role="status">
  <h1>On The Rocks</h1>
  <div id="bar"><div id="fill"></div></div>
  <p id="note">Carico il bar in 3D…</p>
</div>
<div id="rotate" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg>
  <p>Gira il telefono in orizzontale</p>
  <span>Il bancone si gioca col telefono di lato.</span>
</div>

<script>
// Motore e dati arrivano compressi in gzip: li decomprimo mentre scaricano (o dalla copia salvata sul telefono).
(function () {
  var GZ = { "index.wasm": "engine.z.wasm", "index.pck": "data.z.wasm" };
  var TYPES = { "index.wasm": "application/wasm", "index.pck": "application/octet-stream" };
  var plain = window.fetch.bind(window);
  window.fetch = function (input, init) {
    var url = typeof input === "string" ? input : (input && input.url) || "";
    var name = url.split("/").pop().split("?")[0];
    if (!GZ[name] || typeof DecompressionStream === "undefined") return plain(input, init);
    return plain(GZ[name], init).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return new Response(r.body.pipeThrough(new DecompressionStream("gzip")), { status: 200, headers: { "Content-Type": TYPES[name] } });
    });
  };
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
<script src="index.js"></script>
<script>
(function () {
  var note = document.getElementById("note"), fill = document.getElementById("fill"), status = document.getElementById("status");
  function fail(msg) { note.textContent = msg; fill.style.width = "0"; }
  if (typeof DecompressionStream === "undefined") return fail("Serve iOS 16.4 o più recente (o un browser aggiornato) per giocare.");
  try { new WebAssembly.Module(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0])); }
  catch (e) { return fail("Questo browser blocca WebAssembly: il motore 3D non può partire."); }
  var CONFIG = { "args": [], "canvasResizePolicy": 2, "ensureCrossOriginIsolationHeaders": false, "executable": "index", "experimentalVK": false,
    "fileSizes": { "index.pck": 31257420, "index.wasm": 39514754 }, "focusCanvas": true, "gdextensionLibs": [] };
  var engine = new Engine(CONFIG);
  var missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length) return fail("Mancano funzioni del browser: " + missing.join(", ") + ".");
  engine.startGame({
    onProgress: function (cur, tot) {
      if (cur > 0 && tot > 0) { var p = Math.min(100, Math.round(cur / tot * 100)); fill.style.width = p + "%"; note.textContent = "Carico il bar in 3D… " + p + "%"; }
    }
  }).then(function () { status.remove(); }, function (err) { console.error(err); fail("Avvio non riuscito: " + (err && err.message ? err.message : err)); });
})();
</script>
</body>
</html>
